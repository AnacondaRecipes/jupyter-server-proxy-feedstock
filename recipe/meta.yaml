{% set name = "jupyter-server-proxy" %}
{% set version = "4.6.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: b3f8fdb4c6b59fdb41f0d5342f002719eaad5f375e87fa659e21fe69d35ee6c1

build:
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv .
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatch-jupyter-builder >=0.8.3
    - hatchling >=1.18.0
    - jupyterlab >=4.0.6,<5.0.0a0
  run:
    - python
    - aiohttp
    - jupyter_server >=1.24.0
    - simpervisor >=1.0.0
    - tornado >=6.1.0
    - traitlets >=5.1.0
  run_constrained:
    # acceptance
    - robotframework-jupyterlibrary >=0.4.2
    # classic
    - jupyter-server <2
    # - jupyterlab >=3.0.0,<4.0.0a0
    # - notebook <7.0.0a0
    # lab
    # - jupyterlab >=4.0.5,<5.0.0a0
    - notebook >=7
    

# flaky tests (fail/pass on some platforms more frequently than others)
# assertion failure: incorrect response code
{% set test_skip = "" %}
{% set test_skip = test_skip + " --ignore=tests/test_proxies.py" %}

test:
  source_files:
    - tests
  requires:
    - jupyterlab
    - pip
    - notebook
    - pytest
    - pytest-asyncio
    - jupyterhub
  commands:
    - pip check
    # print everything
    - jupyter server extension list
    - jupyter labextension list
    - jupyter notebook extension list
    - jupyter lab extension list
    # validate each
    - jupyter server extension list 1>server_extensions 2>&1
    - grep -ie "jupyter_server_proxy.*OK" server_extensions  # [not win]
    - findstr /i /r "jupyter_server_proxy.*OK" server_extensions  # [win]
    - jupyter labextension list 1>labextensions 2>&1
    - cat labextensions | grep -ie "@jupyterhub/jupyter-server-proxy.*{{ version.replace(".", "\\.") }}.*OK"  # [not win]
    - findstr /i /r "@jupyterhub/jupyter-server-proxy.*{{ version }}.*OK" labextensions  # [win]
    - jupyter notebook extension list 1>notebook_extensions 2>&1
    - cat notebook_extensions | grep -ie "jupyter_server_proxy.*OK"  # [not win]
    - findstr /i /r "jupyter_server_proxy.*OK" notebook_extensions  # [win]
    - jupyter lab extension list 1>lab_extensions 2>&1
    - cat lab_extensions | grep -ie "jupyter_server_proxy.*OK"  # [not win]
    - findstr /i /r "jupyter_server_proxy.*OK" lab_extensions  # [win]
    - pytest --asyncio-mode=auto -vv {{ test_skip }} tests
  imports:
    - jupyter_server_proxy

about:
  home: https://github.com/jupyterhub/jupyter-server-proxy
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - labextension/LICENSE
  summary: Jupyter server extension to supervise and proxy web services
  description: |
    Jupyter Server Proxy lets you run arbitrary external processes (such as
    RStudio, Shiny Server, syncthing, PostgreSQL, etc) alongside your notebook,
    and provide authenticated web access to them.
  doc_url: https://jupyter-server-proxy.readthedocs.io
  dev_url: https://github.com/jupyterhub/jupyter-server-proxy

extra:
  recipe-maintainers:
    - jakirkham
    - lsetiawan
    - minrk
    - ocefpaf
    - xhochy
    - consideratio
    - bollwyvl
